name: library-md5-collision

hosts:
  - name: seed
    base_box:
      image: seed
      mgmt_user: seed
    flavor: m1.medium

  - name: authority
    base_box:
      image: debian-12-x86_64
      mgmt_user: debian
    flavor: m1.medium

routers:
  - name: router
    base_box:
      image: debian-12-x86_64
      mgmt_user: debian
    flavor: m1.medium

wan:
  name: internet-connection
  cidr: 100.100.100.0/24

networks:
  - name: authority-switch
    cidr: 10.1.26.0/24
    accessible_by_user: False
  - name: seed-switch
    cidr: 10.1.27.0/24

net_mappings:
  - host: seed
    network: seed-switch
    ip: 10.1.27.23

  - host: authority
    network: authority-switch
    ip: 10.1.26.9

router_mappings:
  - router: router
    network: authority-switch
    ip: 10.1.26.1
  - router: router
    network: seed-switch
    ip: 10.1.27.1

groups: []
